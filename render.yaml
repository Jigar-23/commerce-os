services:
  # -------------------------------------------------------------
  # 1. Authoritative Backend API Gateway & Realtime Outbox Engine
  # -------------------------------------------------------------
  - type: web
    name: commerce-os-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: pnpm install --frozen-lockfile=false
    startCommand: node platform/server/production-server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: commerce-os-redis
          property: connectionString
      - key: OSRM_BASE_URL
        value: http://osrm-backend:5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: https://auth.commerceos.internal
      - key: JWT_AUDIENCE
        value: commerceos-platform-clients
      - key: COMMERCEOS_OTP_PEPPER
        generateValue: true
      - key: FCM_SERVER_KEY
        sync: false
      - key: FCM_ENDPOINT_URL
        value: https://fcm.googleapis.com/fcm/send
      - key: TWO_FACTOR_API_KEY
        sync: false
      - key: ENABLE_VOICE_OTP
        value: "true"
      - key: CALL_ONLY_OTP
        value: "false"

  # -------------------------------------------------------------
  # 2. Standalone Merchant / Seller Web Portal
  # -------------------------------------------------------------
  - type: web
    name: commerce-os-seller
    runtime: node
    plan: starter
    region: singapore
    buildCommand: pnpm --filter seller build
    startCommand: pnpm --filter seller start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_GATEWAY_URL
        fromService:
          type: web
          name: commerce-os-api
          property: host

  # -------------------------------------------------------------
  # 3. Customer Web Storefront
  # -------------------------------------------------------------
  - type: web
    name: commerce-os-customer-web
    runtime: node
    plan: starter
    region: singapore
    buildCommand: pnpm --filter web build
    startCommand: pnpm --filter web start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: commerce-os-api
          property: host

  # -------------------------------------------------------------
  # 4. Distributed Redis Cache & Pub/Sub (HotLocationBus)
  # -------------------------------------------------------------
  - type: redis
    name: commerce-os-redis
    plan: starter
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

