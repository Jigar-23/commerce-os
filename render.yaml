services:
  - type: web
    name: commerce-os-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install
    startCommand: node platform/server/production-server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: commerce-os-db
          property: connectionString
      - key: OSRM_BASE_URL
        value: http://router.project-osrm.org
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: commerce-os-identity
      - key: JWT_AUDIENCE
        value: commerce-os-platform
      - key: COMMERCEOS_OTP_PEPPER
        generateValue: true
      - key: FCM_SERVER_KEY
        sync: false
      - key: FCM_ENDPOINT_URL
        value: https://fcm.googleapis.com/fcm/send

databases:
  - name: commerce-os-db
    plan: free
    region: singapore
