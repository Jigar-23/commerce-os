version: '3.8'

# Commerce OS - Production / Staging Multi-Container Topology
# Production deployments MUST supply external environment secrets (e.g. from Vault / AWS SSM).
services:
  postgres:
    image: postgres:16-alpine
    container_name: commerceos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commerceos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?CRITICAL: POSTGRES_PASSWORD must be injected via secret manager}
      POSTGRES_MULTIPLE_DATABASES: commerceos_identity,commerceos_customer,commerceos_catalog,commerceos_inventory,commerceos_pricing,commerceos_cart,commerceos_checkout,commerceos_payment,commerceos_order,commerceos_fulfillment,commerceos_delivery,commerceos_prescription,commerceos_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./platform/docker/postgres-init.sh:/docker-entrypoint-initdb.d/init-multidb.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commerceos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: commerceos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?CRITICAL: REDIS_PASSWORD must be injected}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-server:
    build:
      context: .
      dockerfile: platform/docker/Dockerfile.production
    container_name: commerceos-app-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      COMMERCEOS_ENV: production
      PORT: 8083
      DATABASE_URL: postgresql://${POSTGRES_USER:-commerceos}:${POSTGRES_PASSWORD}@postgres:5432/commerceos_order
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?CRITICAL: JWT_SECRET must be injected}
      PAYMENT_GATEWAY_WEBHOOK_SECRET: ${PAYMENT_GATEWAY_WEBHOOK_SECRET:?CRITICAL: PAYMENT_GATEWAY_WEBHOOK_SECRET required}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/api/v1/orders/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: commerceos-prometheus
    restart: unless-stopped
    volumes:
      - ./platform/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: commerceos-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?CRITICAL: GF_SECURITY_ADMIN_PASSWORD required}

volumes:
  postgres_data:
  redis_data:
