version: '3.8'

# Commerce OS - Local Development Infrastructure Stack
services:
  postgres:
    image: postgres:16-alpine
    container_name: commerceos-postgres-dev
    environment:
      POSTGRES_USER: commerceos
      POSTGRES_PASSWORD: commerceos_dev_password
      POSTGRES_MULTIPLE_DATABASES: commerceos_identity,commerceos_customer,commerceos_catalog,commerceos_inventory,commerceos_pricing,commerceos_cart,commerceos_checkout,commerceos_payment,commerceos_order,commerceos_fulfillment,commerceos_delivery,commerceos_prescription,commerceos_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./platform/docker/postgres-init.sh:/docker-entrypoint-initdb.d/init-multidb.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: commerceos-redis-dev
    command: redis-server --appendonly yes --requirepass commerceos_redis_secret
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "commerceos_redis_secret", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: commerceos-zookeeper-dev
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: commerceos-kafka-dev
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: commerceos-opensearch-dev
    environment:
      - cluster.name=commerceos-dev
      - node.name=opensearch-dev-1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch_dev_data:/usr/share/opensearch/data

  minio:
    image: minio/minio:RELEASE.2024-03-26T22-10-48Z
    container_name: commerceos-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: commerceos_minio_admin
      MINIO_ROOT_PASSWORD: commerceos_minio_secret_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: commerceos-prometheus-dev
    volumes:
      - ./platform/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: commerceos-grafana-dev
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=commerceos_grafana_admin

volumes:
  postgres_dev_data:
  redis_dev_data:
  opensearch_dev_data:
  minio_dev_data:
