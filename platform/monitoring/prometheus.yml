# Prometheus Configuration for Commerce OS Platform
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'commerceos-app-server'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app-server:8083']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'commerceos-gateway'

  - job_name: 'commerceos-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'identity-service:8081'
          - 'catalog-service:8082'
          - 'order-service:8084'
          - 'inventory-service:8085'
          - 'payment-service:8086'
          - 'customer-service:8087'
          - 'cart-service:8088'
          - 'return-service:8089'
          - 'ai-service:8091'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
