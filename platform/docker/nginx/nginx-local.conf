# ==============================================================================
# Commerce OS — High-Performance Nginx Load Balancer & DDoS Shield (Local/Host Mode)
# ==============================================================================

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    server_tokens off;

    # DoS Mitigation: Strict Timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    client_max_body_size 10M;

    # Rate Limiting & Connection Shield Zones
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;
    limit_req_zone $binary_remote_addr zone=global_rate_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=checkout_rate_limit:10m rate=10r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream Node.js API Cluster
    upstream commerceos_api_cluster {
        least_conn;
        server host.docker.internal:8083 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        limit_conn addr_conn_limit 50;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        location /health {
            proxy_pass http://commerceos_api_cluster/health;
            access_log off;
        }

        location ~* ^/api/v1/(auth|customer/auth|delivery/rider/login|delivery/rider/send-otp) {
            limit_req zone=auth_rate_limit burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://commerceos_api_cluster;
        }

        location ~* ^/api/v1/(orders/checkout|payments) {
            limit_req zone=checkout_rate_limit burst=15 nodelay;
            limit_req_status 429;
            proxy_pass http://commerceos_api_cluster;
        }

        location ~* ^/api/v1/delivery/stream {
            proxy_pass http://commerceos_api_cluster;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding off;
        }

        location / {
            limit_req zone=global_rate_limit burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://commerceos_api_cluster;

            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }
    }
}
