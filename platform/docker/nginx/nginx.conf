# ==============================================================================
# Commerce OS — High-Performance Nginx Load Balancer & DDoS Shield
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging with Cloudflare True IP awareness
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=16k flush=2s;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # DoS Protection: Strict timeout bounds
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    client_max_body_size 10M;

    # -------------------------------------------------------------------------
    # Cloudflare Real IP Restoration
    # Ensures rate-limiters use real client IPs rather than Cloudflare edge IPs
    # -------------------------------------------------------------------------
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # -------------------------------------------------------------------------
    # Rate Limiting & Connection Shield Zones
    # -------------------------------------------------------------------------
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;
    limit_req_zone $binary_remote_addr zone=global_rate_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=checkout_rate_limit:10m rate=10r/s;

    # WebSocket / SSE Connection Header Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # -------------------------------------------------------------------------
    # Upstream Node.js API Cluster (Least-Connections Load Balancing)
    # -------------------------------------------------------------------------
    upstream commerceos_api_cluster {
        least_conn;
        server app-server:8083 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Maximum concurrent connections per IP (DDoS Mitigation)
        limit_conn addr_conn_limit 30;

        # Gzip Compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

        # Standard Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 1. Health Probe (Bypass Rate Limits for K8s / Docker / Load Balancers)
        location /health {
            proxy_pass http://commerceos_api_cluster/health;
            access_log off;
        }

        # 2. Strict Auth / OTP Endpoints (Brute-Force & Credential Stuffing Shield)
        location ~* ^/api/v1/(auth|customer/auth|delivery/rider/login|delivery/rider/send-otp) {
            limit_req zone=auth_rate_limit burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://commerceos_api_cluster;
        }

        # 3. Sensitive Checkout & Payments (Flash-Sale Rush Protection)
        location ~* ^/api/v1/(orders/checkout|payments) {
            limit_req zone=checkout_rate_limit burst=15 nodelay;
            limit_req_status 429;
            proxy_pass http://commerceos_api_cluster;
        }

        # 4. Realtime Server-Sent Events (SSE) & WebSockets Stream
        location ~* ^/api/v1/delivery/stream {
            proxy_pass http://commerceos_api_cluster;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding off;
        }

        # 5. General APIs (Global Rate Limiter Shield)
        location / {
            limit_req zone=global_rate_limit burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://commerceos_api_cluster;
        }
    }
}
