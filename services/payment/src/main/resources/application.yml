server:
  port: 8086
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/commerceos_payment
    username: ${DB_USERNAME:commerceos}
    password: ${DB_PASSWORD:commerceos_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Schema is owned by Flyway migrations; Hibernate must not mutate it.
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# Internal service coordinates. Secrets and origins are always env-driven.
app:
  order-service:
    base-url: ${ORDER_SERVICE_BASE_URL:http://localhost:8083}
  cors:
    # Comma-separated allow-list; deliberately NOT a wildcard.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://10.0.2.2:8090}
  gateway:
    webhook-secret: ${GATEWAY_WEBHOOK_SECRET:}
    webhook-issuer: ${GATEWAY_WEBHOOK_ISSUER:commerceos-gateway}