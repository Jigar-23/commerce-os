server:
  port: 8081
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/commerceos_catalog
    username: ${DB_USERNAME:commerceos}
    password: ${DB_PASSWORD:commerceos_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:commerceos_redis_secret}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://10.0.2.2:8090}
