server:
  port: 8088
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: return-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/commerceos_return
    username: ${DB_USERNAME:commerceos}
    password: ${DB_PASSWORD:commerceos_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://10.0.2.2:8090}
